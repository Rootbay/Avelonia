[package]
name = "avelonia"
version = "0.1.0"
description = "A PC maintaince suite app"
authors = ["xeintdm", "Pysen"]
edition = "2024"

[lib]
name = "avelonia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "^0.10"
trash = "^5"
sysinfo = "0.37"
lnk = "^0.6"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
dashmap = "5.5.3"
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "^0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading"] }
winreg = "0.52"
csv = "1"
percent-encoding = "2"
once_cell = "1"
rayon = "1.10"
regex = "1"
jwalk = "0.8.1"
